<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="Luratic, inicio"><img src="{{ .Site.Params.logo | relURL }}" width="44" height="44" alt=""><span>Luratic<span class="brand-dot">.</span></span></a>
    <button class="menu-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Abrir navegación">{{ partial "icon.html" "menu" }}</button>
    <nav id="site-nav" class="site-nav" aria-label="Navegación principal">
      <a href="{{ "/recursos/" | relURL }}" {{ if eq .Section "recursos" }}aria-current="page"{{ end }}>Recursos</a>
      <a href="{{ "/recursos/?tipo=template" | relURL }}">Plantillas para GTM</a>
      <a href="{{ "/equipo/" | relURL }}" {{ if eq .Section "equipo" }}aria-current="page"{{ end }}>Quiénes somos</a>
      <a href="{{ "/posts/" | relURL }}" {{ if eq .Section "posts" }}aria-current="page"{{ end }}>Documentación</a>
      <a class="github-nav" href="{{ .Site.Params.github }}" target="_blank" rel="noopener">{{ partial "icon.html" "github" }}<span>GitHub</span>{{ partial "icon.html" "external" }}</a>
    </nav>
  </div>
</header>
