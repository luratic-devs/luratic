  <div class="home-shell">

      <nav class="home-footer-links" aria-label="{{ i18n "footerNav" }}"><a href="{{ "/recursos/" | relLangURL }}">{{ i18n "resources" }}</a><a href="{{ "/plantillas/" | relLangURL }}">{{ i18n "templatesGTM" }}</a><a href="{{ "/equipo/" | relLangURL }}">{{ i18n "team" }}</a><a href="{{ .Site.Params.github }}" target="_blank" rel="noopener">{{ i18n "codeOnGithub" }}</a><a href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a></nav>
