<script>
(function (w) {
  'use strict';
  w.dataLayer = w.dataLayer || [];
  w.gtag = w.gtag || function () { w.dataLayer.push(arguments); };

  var analytics = 'denied';
  try {
    var saved = JSON.parse(w.localStorage.getItem('luratic_consent_v1') || 'null');
    if (saved && saved.analytics === 'granted') analytics = 'granted';
  } catch (error) {}

  var consentState = {
    analytics_storage: analytics,
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied'
  };

  w.__luraticConsentState = {
    mode: 'default',
    analytics_storage: consentState.analytics_storage,
    ad_storage: consentState.ad_storage,
    ad_user_data: consentState.ad_user_data,
    ad_personalization: consentState.ad_personalization
  };

  w.gtag('consent', 'default', consentState);
})(window);
</script>
