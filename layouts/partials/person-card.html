<article class="person-card"><a class="person-photo" href="{{ .RelPermalink }}" aria-label="{{ i18n "meetCareer" }}: {{ .Params.displayName }}">{{ with .Params.photo }}<img src="{{ . | relURL }}" alt="" loading="lazy" width="600" height="600">{{ else }}<span class="person-initials">BC<span>↗</span></span>{{ end }}</a><div class="person-card-body"><span class="eyebrow">{{ i18n "behindCode" }}</span><h3><a href="{{ .RelPermalink }}">{{ .Params.displayName }}</a></h3><p>{{ .Params.role }}</p><a class="text-link" href="{{ .RelPermalink }}">{{ i18n "meetCareer" }} {{ partial "icon.html" "arrow" }}</a></div></article>
