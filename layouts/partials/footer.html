{{ if .IsHome }}{{ partial "home/footer.html" . }}{{ else }}
<footer class="site-footer">
  <div class="shell footer-top"><div><a class="brand footer-brand" href="{{ "/" | relLangURL }}"><img src="{{ .Site.Params.logo | relURL }}" width="42" height="42" alt=""><span>Luratic.</span></a><p>{{ i18n "footerAbout" }}</p></div><div class="footer-links"><a href="{{ "/recursos/" | relLangURL }}">{{ i18n "exploreResources" }}</a><a href="{{ "/equipo/" | relLangURL }}">{{ i18n "meetTeam" }}</a><a href="{{ .Site.Params.github }}" target="_blank" rel="noopener">{{ i18n "codeOnGithub" }} ↗</a><a href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a></div></div>
  <div class="shell footer-bottom"><span>© {{ now.Year }} Luratic</span><span>{{ i18n "learnCreateShare" }}</span><a href="{{ "/privacy-policy/" | relLangURL }}">{{ i18n "privacy" }}</a></div>
</footer>
{{ end }}
