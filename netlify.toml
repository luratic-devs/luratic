[build]
command = "hugo --gc --minify && python3 scripts/check_privacy.py && node scripts/check_tracking.mjs --production"
publish = "public"

[build.environment]
HUGO_VERSION = "0.168.0"
HUGO_ENV = "production"
NODE_VERSION = "24"

[context.deploy-preview]
command = "hugo --gc --minify --environment preview -b \"$DEPLOY_PRIME_URL\" && python3 scripts/check_privacy.py && node scripts/check_tracking.mjs --preview"

[context.branch-deploy]
command = "hugo --gc --minify --environment preview -b \"$DEPLOY_PRIME_URL\" && python3 scripts/check_privacy.py && node scripts/check_tracking.mjs --preview"

[[headers]]
for = "/fonts/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
